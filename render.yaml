services:
  - type: web
    name: pedidos-locales
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_PATH
        value: /opt/render/project/src/storage/pedidos_locales.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYU_MERCHANT_ID
        sync: false
      - key: PAYU_ACCOUNT_ID
        sync: false
      - key: PAYU_API_KEY
        sync: false
      - key: PAYU_TEST
        value: "1"
